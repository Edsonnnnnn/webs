<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>oye</title>
<style>

  /* =====================================================
     PERSONALIZA AQUI: paleta de colores
     cambia estos valores y se actualiza toda la pagina
     ===================================================== */
  :root{
    --bg: #E7DFC9;        /* fondo general, tipo cartulina */
    --tinta: #241C15;     /* texto principal */
    --papel: #FFFDF6;     /* color de las notitas / tarjetas */
    --acento: #D6491F;    /* botones principales */
    --acento-hover: #B93A15;
    --miel: #E8A94A;      /* detalles, tape, subrayados */
    --verde: #3E6B4F;     /* botones secundarios / confirmar */
    --verde-hover: #2E5039;
    --linea: #C9BFA0;     /* bordes y lineas sutiles */
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--bg);
    background-image:
      radial-gradient(circle, rgba(36,28,21,0.07) 1px, transparent 1px);
    background-size: 18px 18px;
    color: var(--tinta);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .escenario{
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 20px 80px;
  }

  .hoja{
    width: 100%;
    max-width: 420px;
  }

  /* la "notita de papel" que contiene cada pantalla */
  .pantalla{
    display: none;
    background: var(--papel);
    border-radius: 3px 16px 4px 14px;
    padding: 34px 26px 30px;
    position: relative;
    box-shadow:
      0 1px 0 var(--linea),
      0 18px 30px -18px rgba(36,28,21,0.45),
      0 2px 6px rgba(36,28,21,0.15);
    transform: rotate(-0.6deg);
    animation: aparece .38s ease;
  }
  .pantalla:nth-of-type(even){ transform: rotate(0.5deg); }
  .pantalla.activa{ display: block; }

  @keyframes aparece{
    from{ opacity: 0; transform: translateY(10px) rotate(-0.6deg); }
    to{ opacity: 1; transform: translateY(0) rotate(-0.6deg); }
  }

  /* cinta adhesiva decorativa arriba de la notita */
  .pantalla::before{
    content: "";
    position: absolute;
    top: -14px;
    left: 32px;
    width: 64px;
    height: 26px;
    background: var(--miel);
    opacity: .75;
    transform: rotate(-4deg);
    box-shadow: 0 1px 2px rgba(36,28,21,0.25);
  }

  h1, h2{
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-style: italic;
    font-weight: 700;
    line-height: 1.15;
    margin: 0 0 14px;
  }

  h1{ font-size: 30px; }
  h2{ font-size: 26px; }

  p{ margin: 0 0 20px; line-height: 1.5; font-size: 16px; }

  .flechita{ display:block; margin: 0 0 10px -4px; }

  /* botones */
  .fila-botones{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 6px;
  }

  button{
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    border: none;
    padding: 12px 18px;
    color: #fff;
    background: var(--tinta);
    border-radius: 10px 4px 10px 4px;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: 0 3px 0 rgba(36,28,21,0.55);
  }
  button:active{
    transform: translateY(3px);
    box-shadow: 0 0 0 rgba(36,28,21,0.55);
  }

  .btn-principal{ background: var(--acento); }
  .btn-principal:hover{ background: var(--acento-hover); }

  .btn-secundario{ background: var(--verde); }
  .btn-secundario:hover{ background: var(--verde-hover); }

  .btn-plan{
    background: var(--papel);
    color: var(--tinta);
    border: 2px solid var(--tinta);
    box-shadow: 3px 3px 0 var(--tinta);
  }
  .btn-plan:active{ box-shadow: 0 0 0 var(--tinta); }
  .btn-plan.elegido{
    background: var(--acento);
    border-color: var(--acento);
    color: #fff;
    box-shadow: 3px 3px 0 var(--acento-hover);
  }

  .volver{
    display:inline-block;
    margin-top: 22px;
    background: none;
    color: var(--tinta);
    box-shadow: none;
    padding: 6px 0;
    text-decoration: underline;
    text-decoration-color: var(--miel);
    text-decoration-thickness: 3px;
  }
  .volver:active{ transform: none; }

  /* inputs */
  label{
    display:block;
    font-size: 13px;
    color: var(--tinta);
    opacity: .7;
    margin: 18px 0 6px;
  }

  input[type="text"], input[type="time"]{
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    padding: 10px 12px;
    border: none;
    border-bottom: 2px solid var(--linea);
    background: transparent;
    color: var(--tinta);
  }
  input[type="text"]:focus, input[type="time"]:focus{
    outline: none;
    border-bottom-color: var(--acento);
  }

  .oculto{ display: none !important; }

  .resumen{
    margin-top: 22px;
    padding: 14px 16px;
    background: rgba(62,107,79,0.1);
    border-left: 3px solid var(--verde);
    font-size: 15px;
  }

  .subrayado{
    background-image: linear-gradient(transparent 65%, var(--miel) 65%);
  }

  /* seccion de la imagen */
  .foto-envoltorio{
    margin-top: 4px;
    background: #fff;
    padding: 10px 10px 34px;
    box-shadow: 0 8px 18px rgba(36,28,21,0.25);
    transform: rotate(1.2deg);
  }
  .foto-envoltorio img{
    display:block;
    width: 100%;
    height: auto;
    max-height: 320px;
    object-fit: cover;
    background: var(--linea);
  }
  .foto-envoltorio p{
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 14px;
    text-align: center;
    margin: 10px 0 0;
    color: var(--tinta);
  }

</style>
</head>

<script>
  // ============ navegacion entre pantallas, sin recargar la pagina ============
  function irA(nombre){
    document.querySelectorAll('.pantalla').forEach(function(p){
      p.classList.remove('activa');
    });
    var destino = document.querySelector('[data-pantalla="' + nombre + '"]');
    if(destino){ destino.classList.add('activa'); }
    window.scrollTo(0, 0); // vuelve al inicio de la pagina al cambiar de seccion
  }

  document.querySelectorAll('[data-ir]').forEach(function(btn){
    btn.addEventListener('click', function(){
      irA(btn.getAttribute('data-ir'));
    });
  });

  // ============ eleccion de plan ============
  var planElegido = "";
  var botonesPlan = document.querySelectorAll('#opciones-plan .btn-plan');

  botonesPlan.forEach(function(btn){
    btn.addEventListener('click', function(){
      botonesPlan.forEach(function(b){ b.classList.remove('elegido'); });

      if(btn.hasAttribute('data-plan-otra')){
        document.getElementById('caja-otra-cosa').classList.remove('oculto');
        planElegido = "";
      } else {
        document.getElementById('caja-otra-cosa').classList.add('oculto');
        planElegido = btn.getAttribute('data-plan');
        btn.classList.add('elegido');
      }
    });
  });

  document.getElementById('input-otra').addEventListener('input', function(e){
    planElegido = e.target.value;
  });
</script>
